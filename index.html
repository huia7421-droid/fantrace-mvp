<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#EDF0F4;

  --accent:#0E6F7C; --accent-soft:#E2F1F3;
  --new:#A8491A; --new-soft:#FBEADF;
  --cap:#7D5200; --cap-soft:#FCF2DA;
  --full:#53357F; --full-soft:#EFE8F8;
  --auto:#4A5360; --auto-soft:#E8EBEF;

  --body:"IBM Plex Sans","PingFang TC","Microsoft JhengHei",sans-serif;
  --data:"IBM Plex Mono","PingFang TC","Microsoft JhengHei",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1317; --surface:#171C22; --surface-2:#1F252D;
  --fg:#E6EAEF; --muted:#97A1AE; --line:#272E37;
  --accent:#3FB3BE; --accent-soft:#12333A;
  --new:#E0924F; --new-soft:#3A2415;
  --cap:#E2B35A; --cap-soft:#352A10;
  --full:#C0A3E8; --full-soft:#2A1F3D;
  --auto:#A6B0BC; --auto-soft:#242B33;
  --warn:#E88B8B; --warn-soft:#3A1E1E;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1317; --surface:#171C22; --surface-2:#1F252D;
  --fg:#E6EAEF; --muted:#97A1AE; --line:#272E37;
  --accent:#3FB3BE; --accent-soft:#12333A;
  --new:#E0924F; --new-soft:#3A2415;
  --cap:#E2B35A; --cap-soft:#352A10;
  --full:#C0A3E8; --full-soft:#2A1F3D;
  --auto:#A6B0BC; --auto-soft:#242B33;
  --warn:#E88B8B; --warn-soft:#3A1E1E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:860px;margin:0 auto;padding-inline:18px;padding-block:0 56px}
h1,h2{margin:0;text-wrap:balance}
a{color:var(--accent)}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap}
.brand{font-weight:600;font-size:16px;letter-spacing:-.01em}
.newpill{margin-left:auto;font-family:var(--data);font-size:12px;font-weight:500;
  color:var(--new);background:var(--new-soft);
  border:1px solid color-mix(in srgb,var(--new) 28%,transparent);
  padding:5px 10px;border-radius:999px;white-space:nowrap}
.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);
  color:var(--warn);border-radius:10px;padding:12px 15px;margin-block:18px;font-size:13.5px}
.sec{margin-block:28px}
.sec-hd{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec-hd h2{font-size:19px;font-weight:600;letter-spacing:-.01em}
.sec-n{font-family:var(--data);font-size:12px;color:var(--muted)}
.evs{display:grid;gap:10px}
.ev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
  display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:start}
.ev-when{font-family:var(--data);font-size:12.5px;color:var(--accent);font-weight:500;
  white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.ev-t{font-weight:600;font-size:15px;min-width:0}
.ev-m{grid-column:2;font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;
  align-items:center}
.ev-empty{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;
  padding:22px 16px;text-align:center;color:var(--muted);font-size:13px}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.frow{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}
.flab{font-family:var(--data);font-size:10.5px;color:var(--muted);letter-spacing:.07em;
  min-width:62px;flex-shrink:0}
.chip{font-size:12.5px;font-family:var(--body);background:var(--surface-2);color:var(--fg);
  border:1px solid transparent;padding:4px 10px;border-radius:999px;cursor:pointer;
  white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.fsel{font-size:12.5px;font-family:var(--body);background:var(--surface-2);color:var(--fg);
  border:1px solid var(--line);border-radius:7px;padding:5px 8px;max-width:100%}
.clearf{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;
  text-decoration:underline;padding:4px}
.cts{display:grid;gap:8px}
.ct{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  display:grid;gap:7px}
.ct.is-new{border-left:3px solid var(--new);padding-left:11px}
.ct-r1{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ct-r2{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;min-width:0}
.ct-r3{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bd{font-family:var(--data);font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;
  white-space:nowrap}
.bd-k{background:var(--surface-2);color:var(--muted)}
.bd-cap{background:var(--cap-soft);color:var(--cap)}
.bd-full{background:var(--full-soft);color:var(--full)}
.bd-auto{background:var(--auto-soft);color:var(--auto)}
.bd-new{background:var(--new-soft);color:var(--new)}
.ct-who{font-family:var(--data);font-size:13.5px;font-weight:500;color:var(--fg)}
.ct-when{font-family:var(--data);font-size:12px;color:var(--muted);margin-left:auto;
  white-space:nowrap;font-variant-numeric:tabular-nums}
.ct-go{font-family:var(--data);font-size:12px;color:var(--accent);text-decoration:none;
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-radius:6px;
  padding:3px 9px;white-space:nowrap}
.offsite{font-family:var(--data);font-size:10.5px;color:var(--muted)}
.none{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;
  background:var(--surface-2);border-radius:10px}
#dbg{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  margin-top:26px}
#dbg h2{font-size:14px;padding:12px 15px;border-bottom:1px solid var(--line)}
.tscroll{overflow-x:auto;max-height:260px}
table{width:100%;border-collapse:collapse;font-family:var(--data);font-size:11.5px}
th{text-align:left;padding:7px 10px;color:var(--muted);font-weight:500;
  background:var(--surface-2);position:sticky;top:0;white-space:nowrap}
td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:560px){
  .flab{min-width:100%}
  .ev{grid-template-columns:1fr}
  .ev-m{grid-column:1}
  .ct-when{margin-left:0}

</style>
</head>

<script>
/* ═══════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════ */
const TRACK_URL = "https://script.google.com/macros/s/AKfycbwvxm9GcRag7NFUpIi4WpijrVK_595xPvBCfweE7gsU4eW_sz791OwpyzC7x9egVYkpSA/exec";
/* ═══════════════════════════════════════════════════════════════
   ⬆⬆⬆  改完這行就可以上線了，下面都不用動  ⬆⬆⬆
   ═══════════════════════════════════════════════════════════════ */

const TODAY = new Date().toISOString().slice(0,10);
const Q = new URLSearchParams(location.search);
const U = (Q.get("u") || "").replace(/[^0-9]/g,"").slice(0,3);
const V = Q.get("v") === "b" ? "b" : "a";
const DEBUG = Q.get("debug") === "1";

let LAST = "2000-01-01T00:00";
try { LAST = localStorage.getItem("ft_last_" + (U||"x")) || LAST; } catch(e) {}

const EV_BY_ID = Object.fromEntries(EVENTS.map(e => [e.id, e]));
const dt = c => c.date + "T" + (c.time || "23:59");
const isNew = c => dt(c) > LAST;
const md = s => s ? s.slice(5).replace("-","/") : "";
const esc = s => String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

/* ── 追蹤：每個動作送一列到 Google 試算表 ── */
function track(action, section, target, trType) {
  const row = {
    u: U || "none", v: V, action: action, section: section,
    target: String(target || ""), tr: trType || "",
    at: new Date().toISOString(), ua: navigator.userAgent.slice(0,120)
  };
  let sent = "送出中";
  if (TRACK_URL.indexOf("http") === 0) {
    try {
      fetch(TRACK_URL, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(row)
      }).then(() => {}).catch(() => {});
      sent = "已送";
    } catch(e) { sent = "失敗"; }
  } else {
    sent = "未設定網址";
  }
  if (DEBUG) {
    const tb = document.getElementById("dbg-rows");
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${new Date().toTimeString().slice(0,8)}</td><td>${esc(row.u)}</td>`
      + `<td>${row.v}</td><td>${esc(action)}</td><td>${esc(section)}</td>`
      + `<td>${esc(row.target)}</td><td>${sent}</td>`;
    tb.insertBefore(tr, tb.firstChild);
  }
}

/* ── 行程區 ── */
function renderEvents() {
  const up = EVENTS.filter(e => e.date >= TODAY)
                   .sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
  document.getElementById("n-ev").textContent = up.length + " 場";
  const box = document.getElementById("evs");
  if (!up.length) {
    box.innerHTML = '<div class="ev-empty">目前沒有已公告的活動。<br>'
      + '有新公告我們會馬上更新，可以過幾天再回來看。</div>';
    return;
  }
  box.innerHTML = up.map(e => `<div class="ev">
    <div class="ev-when">${md(e.date)}<br>${e.time}</div>
    <div class="ev-t">${esc(e.title)}</div>
    <div class="ev-m">
      <span class="bd bd-k">${esc(e.type)}</span>
      <span>${e.online ? "線上" : "線下"} · ${esc(e.venue)}</span>
      <span>${esc(e.artists.join(" / "))}</span>
      ${e.src ? `<a class="ct-go" href="${esc(e.src)}" target="_blank" rel="noopener" data-ev="${e.id}">公告 ↗</a>` : '<span class="offsite">無官方公告</span>'}
    </div></div>`).join("");
  box.querySelectorAll("[data-ev]").forEach(a =>
    a.addEventListener("click", () => track("外連點擊", "行程區", a.dataset.ev)));
}

/* ── 篩選器 ── */
const F = { subj:null, type:null, tr:null, ev:"", who:"" };
const SUBJ = ["Namtan","Film","Milk","Love","View","Mim"];
const TYPES = [...new Set(CONTENTS.map(c => c.ct))];

function chips(host, items, key, label) {
  const el = document.getElementById(host);
  el.innerHTML = items.map(v =>
    `<button class="chip" type="button" aria-pressed="false" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  el.querySelectorAll(".chip").forEach(b =>
    b.addEventListener("click", () => {
      const on = F[key] === b.dataset.v;
      F[key] = on ? null : b.dataset.v;
      el.querySelectorAll(".chip").forEach(x =>
        x.setAttribute("aria-pressed", String(!on && x === b)));
      track("篩選", label, F[key] || "清除");
      renderContents();
    }));
}

function initFilters() {
  chips("f-subj", SUBJ, "subj", "人物");
  chips("f-type", TYPES, "type", "類型");
  chips("f-tr", ["文案有翻譯","完整翻譯","平台字幕"], "tr", "翻譯");

  const sel = document.getElementById("f-ev");
  EVENTS.filter(e => CONTENTS.some(c => c.ev === e.id)).forEach(e => {
    const n = CONTENTS.filter(c => c.ev === e.id).length;
    sel.insertAdjacentHTML("beforeend",
      `<option value="${e.id}">${md(e.date)} ${esc(e.title)}（${n}）</option>`);
  });
  sel.addEventListener("change", () => {
    F.ev = sel.value;
    track("依活動檢索", "內容區", sel.value || "清除");
    renderContents();
  });

  const who = document.getElementById("f-who");
  const cnt = {};
  CONTENTS.forEach(c => cnt[c.who] = (cnt[c.who]||0) + 1);
  Object.entries(cnt).sort((a,b) => b[1]-a[1]).forEach(([h,n]) =>
    who.insertAdjacentHTML("beforeend", `<option value="${esc(h)}">${esc(h)}（${n}）</option>`));
  who.addEventListener("change", () => {
    F.who = who.value;
    track("依拍攝者檢索", "內容區", who.value || "清除");
    renderContents();
  });

  document.getElementById("clearf").addEventListener("click", () => {
    F.subj = F.type = F.tr = null; F.ev = F.who = "";
    document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed","false"));
    sel.value = ""; who.value = "";
    track("清除篩選", "內容區", "全部");
    renderContents();
  });
}

/* ── 內容區 ── */
function match(c) {
  if (F.subj && !c.subj.includes(F.subj)) return false;
  if (F.type && c.ct !== F.type) return false;
  if (F.ev && c.ev !== F.ev) return false;
  if (F.who && c.who !== F.who) return false;
  if (F.tr === "文案有翻譯" && !c.cap) return false;
  if (F.tr === "完整翻譯" && c.ct !== "粉絲翻譯") return false;
  if (F.tr === "平台字幕" && c.ct !== "平台字幕") return false;
  return true;
}

function renderContents() {
  const list = CONTENTS.filter(match).sort((a,b) => dt(b).localeCompare(dt(a)));
  document.getElementById("n-ct").textContent =
    list.length === CONTENTS.length ? CONTENTS.length + " 筆"
                                    : list.length + " / " + CONTENTS.length + " 筆";
  const box = document.getElementById("cts");
  if (!list.length) { box.innerHTML = '<div class="none">這組條件沒有內容。</div>'; return; }
  box.innerHTML = list.map(c => {
    const e = EV_BY_ID[c.ev], n = isNew(c);
    const b = [`<span class="bd bd-k">${esc(c.ct === "粉絲翻譯" ? "完整翻譯" : c.ct)}</span>`];
    if (c.cap) b.push('<span class="bd bd-cap">📝 文案有翻譯</span>');
    if (c.ct === "粉絲翻譯") b.push('<span class="bd bd-full">🎬 完整翻譯</span>');
    if (c.ct === "平台字幕") b.push('<span class="bd bd-auto">🤖 平台字幕</span>');
    if (c.fansite) b.push('<span class="bd bd-k">站姊</span>');
    if (n) b.push('<span class="bd bd-new">NEW</span>');
    const off = ["bilibili","Threads","YouTube","Instagram"].includes(c.pf);
    const when = (c.prec === "date_only" ? md(c.date) + " 時間不詳"
                  : md(c.date) + " " + c.time + (c.prec === "approx" ? " 左右" : ""))
                 + (c.hrs != null ? ` · 活動後 ${c.hrs.toFixed(1)} 小時` : "");
    const trType = c.cap ? "cap" : c.ct === "粉絲翻譯" ? "full"
                   : c.ct === "平台字幕" ? "auto" : "";
    return `<div class="ct${n ? " is-new" : ""}">
      <div class="ct-r1">${b.join("")}</div>
      <div class="ct-r2">
        <span class="ct-who">${esc(c.who)}</span>
        <span>${esc(c.pf)}${off ? ' <span class="offsite">站外</span>' : ""}</span>
        <span class="ct-when">${when}</span>
      </div>
      <div class="ct-r3">
        <span>${esc(e ? e.title : c.ev)}</span>
        ${c.subj.length ? `<span>拍到 ${esc(c.subj.join(" / "))}</span>` : ""}
        <a class="ct-go" href="${esc(c.url)}" target="_blank" rel="noopener"
           data-c="${c.id}" data-tr="${trType}">看內容 ↗</a>
      </div></div>`;
  }).join("");
  box.querySelectorAll("[data-c]").forEach(a =>
    a.addEventListener("click", () =>
      track("外連點擊", "內容區", a.dataset.c, a.dataset.tr)));
}

/* ── 新增提示 ── */
function renderNew() {
  const n = CONTENTS.filter(isNew).length;
  const pill = document.getElementById("newpill");
  if (n && n < CONTENTS.length) {
    pill.textContent = `新增 ${n} 筆`;
    pill.hidden = false;
  } else {
    pill.hidden = true;
  }
}

/* ── 兩區順序（v=b 時內容區在上）── */
function applyV() {
  if (V === "b") {
    const w = document.querySelector(".wrap");
    w.insertBefore(document.getElementById("sec-content"),
                   document.getElementById("sec-sched"));
  }
}

/* ── 啟動 ── */
document.getElementById("nouser").hidden = !!U;
document.getElementById("dbg").hidden = !DEBUG;
renderEvents();
initFilters();
renderContents();
renderNew();
applyV();
track("開啟頁面", V === "b" ? "內容區在上" : "行程區在上", location.search || "(無參數)");

/* 離開頁面時把「上次造訪」更新成現在 */
window.addEventListener("pagehide", () => {
  try { localStorage.setItem("ft_last_" + (U||"x"), new Date().toISOString().slice(0,16)); } catch(e) {}
});
</script>
</body>
</html>
