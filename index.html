<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NamtanFilm 行程與內容</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 版面：兩個獨立面板（行程／內容），內容以卡片列呈現，左側型別色塊作為視覺錨點 */
:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --sunk:#EBEEF2; --card:#FFFFFF;
  --fg:#111820; --fg-2:#3D4753; --muted:#6B7480; --line:#DFE4EA; --line-2:#EDF0F3;
  --accent:#0C6B78; --accent-2:#0A5A66; --accent-soft:#E0F0F2;
  --vid:#0C6B78;  --vid-soft:#E0F0F2;
  --pic:#8A5500;  --pic-soft:#FBF1DC;
  --tra:#5B3A8C;  --tra-soft:#EEE8F8;
  --off:#1E4E8C;  --off-soft:#E4EDF8;
  --new:#A3451A;  --new-soft:#FBE8DD;
  --cp:#A8325F;   --cp-soft:#FBE6EE;
  --warn:#8A2B2B; --warn-soft:#FAE5E5;
  --r:14px; --r-sm:9px;
  --sh:0 1px 2px rgba(17,24,32,.05), 0 1px 1px rgba(17,24,32,.03);
  --sh-up:0 4px 14px rgba(17,24,32,.09), 0 1px 3px rgba(17,24,32,.05);
  --display:"Bricolage Grotesque","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"IBM Plex Sans","PingFang TC","Microsoft JhengHei",sans-serif;
  --data:"IBM Plex Mono","PingFang TC",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1014; --panel:#151A20; --sunk:#10151A; --card:#1A2027;
  --fg:#E8ECF1; --fg-2:#C2CAD4; --muted:#8F99A6; --line:#262D36; --line-2:#1F262E;
  --accent:#44B8C4; --accent-2:#5FCAD4; --accent-soft:#0F3038;
  --vid:#44B8C4;  --vid-soft:#0F3038;
  --pic:#E0B45F;  --pic-soft:#332714;
  --tra:#C4A6EC;  --tra-soft:#271C3A;
  --cp:#F09CBE;   --cp-soft:#3A1C28;
  --off:#7FAEE8;  --off-soft:#16263B;
  --new:#E29157;  --new-soft:#38220F;
  --warn:#E88B8B; --warn-soft:#361C1C;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh-up:0 4px 16px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C1014; --panel:#151A20; --sunk:#10151A; --card:#1A2027;
  --fg:#E8ECF1; --fg-2:#C2CAD4; --muted:#8F99A6; --line:#262D36; --line-2:#1F262E;
  --accent:#44B8C4; --accent-2:#5FCAD4; --accent-soft:#0F3038;
  --vid:#44B8C4;  --vid-soft:#0F3038;
  --pic:#E0B45F;  --pic-soft:#332714;
  --tra:#C4A6EC;  --tra-soft:#271C3A;
  --cp:#F09CBE;   --cp-soft:#3A1C28;
  --off:#7FAEE8;  --off-soft:#16263B;
  --new:#E29157;  --new-soft:#38220F;
  --warn:#E88B8B; --warn-soft:#361C1C;
  --sh:0 1px 2px rgba(0,0,0,.4);
  --sh-up:0 4px 16px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
h1,h2{margin:0;font-family:var(--display);text-wrap:balance;letter-spacing:-.015em}
a{color:var(--accent)}
.mono{font-family:var(--data);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}

/* ── 頁首 ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;padding:11px 16px 9px;display:flex;align-items:center;gap:10px}
.tabs-wrap{max-width:780px;margin:0 auto;padding:0 16px 10px}
.tabs{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line-2);
  border-radius:11px;padding:4px}
.tab{flex:1 1 0;min-width:0;border:none;background:transparent;color:var(--muted);
  font-size:13.5px;font-weight:500;padding:9px 8px;border-radius:8px;cursor:pointer;min-height:44px;
  display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;
  transition:transform .11s cubic-bezier(.34,1.56,.64,1), background .15s ease, color .15s ease}
.tab:active{transform:scale(.95)}
.tab[aria-selected="true"]{background:var(--panel);color:var(--fg);font-weight:600;
  box-shadow:var(--sh)}
.tab-n{font-family:var(--data);font-size:11px;font-weight:500;color:var(--muted);
  background:var(--line-2);padding:2px 6px;border-radius:5px}
.tab[aria-selected="true"] .tab-n{background:var(--accent-soft);color:var(--accent)}
.tab-dot{width:7px;height:7px;border-radius:50%;background:var(--new);flex:0 0 auto}
.brand{font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.02em;
  display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto}
.newpill{font-family:var(--data);font-size:11.5px;font-weight:500;
  color:var(--new);background:var(--new-soft);
  border:1px solid color-mix(in srgb,var(--new) 30%,transparent);
  padding:5px 11px;border-radius:999px;white-space:nowrap}

.warn{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 32%,transparent);
  color:var(--warn);border-radius:var(--r);padding:13px 15px;margin-top:18px;font-size:13.5px}

/* ── 面板（兩區的分隔感就靠這個）── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  box-shadow:var(--sh);margin-top:14px;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;
  border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.panel-hd h2{font-size:18px;font-weight:700}
.panel-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--accent-soft);color:var(--accent)}
.panel-ic svg{width:15px;height:15px;display:block}
.count{margin-left:auto;font-family:var(--data);font-size:11.5px;color:var(--muted);
  background:var(--sunk);border:1px solid var(--line-2);padding:4px 9px;border-radius:7px;
  white-space:nowrap}
.panel-bd{padding:14px}
.newrow{display:flex;margin-bottom:11px}
.newrow:empty,.newrow:has(.newpill[hidden]){display:none}

/* ── 行程卡 ── */
.evs{display:grid;gap:11px}
.ev{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:14px 15px;display:grid;gap:9px;
  transition:transform .13s ease, box-shadow .13s ease}
.ev:hover{box-shadow:var(--sh-up)}
/* ── 已完成的活動 ── */
.ev-sep{display:flex;align-items:center;gap:9px;margin:20px 0 11px}
.ev-sep .lab{font-family:var(--data);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ev-sep .n{font-family:var(--data);font-size:11px;color:var(--muted);
  background:var(--sunk);border:1px solid var(--line-2);padding:2px 7px;border-radius:6px}
.ev-sep::after{content:"";flex:1 1 auto;height:1px;background:var(--line)}
.ev.done{border-left-color:var(--line-2);background:var(--sunk)}
.ev.done .ev-date{background:transparent;color:var(--muted);border:1px solid var(--line-2)}
.ev.done .ev-t{color:var(--fg-2)}
.ev.done .face,.ev.done .ini{filter:saturate(.75)}
.bd-live{background:var(--new-soft);color:var(--new);font-weight:700}
.ev-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ev-date{font-family:var(--data);font-size:13px;font-weight:500;color:var(--accent);
  background:var(--accent-soft);padding:4px 9px;border-radius:7px;white-space:nowrap}
.ev-t{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.35;min-width:0}
.ev-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}
/* ── 行程卡：參與者（放在標題之前，一眼就看得到是誰）── */
.cast{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.cm{display:inline-flex;align-items:center;gap:7px;padding:3px 12px 3px 3px;border-radius:99px;
  background:var(--sunk);border:1px solid var(--line-2);max-width:100%}
.cm-n{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face{width:30px;height:30px;border-radius:50%;flex:0 0 auto;object-fit:cover;display:block;
  border:1.5px solid var(--card);box-shadow:0 0 0 1px var(--line-2)}
.ini{width:30px;height:30px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  font-family:var(--display);font-size:13px;font-weight:700;color:#fff;
  border:1.5px solid var(--card);box-shadow:0 0 0 1px var(--line-2)}
.cm.is-mascot{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent)}
.cm.is-mascot .cm-n{color:var(--accent);font-size:13px}
@media(max-width:420px){
  .cm{padding:3px 10px 3px 3px;gap:6px}
  .cm-n{font-size:13.5px}
  .face,.ini{width:27px;height:27px}
}
.ev-ht{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:2px}
.ht-lab{font-family:var(--data);font-size:9.5px;letter-spacing:.09em;color:var(--muted);
  text-transform:uppercase}
.ht{font-family:var(--data);font-size:11px;color:var(--accent);background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);
  padding:3px 7px;border-radius:6px;white-space:nowrap;user-select:all;cursor:text}

/* ── 內容卡 ── */
.cts{display:grid;gap:10px}
.ct{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:13px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;
  transition:transform .13s ease, box-shadow .13s ease, border-color .13s ease}
.ct:hover{box-shadow:var(--sh-up);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))}
/* ── 整張卡都可以點 ──
   點擊是用事件代理做的（見 initCardClick），不是用 CSS 蓋一層透明區塊，
   這樣卡片上的文字仍然可以反白複製，刷推標籤也不會被擋住。 */
.ct:has(.go), .ev:has(.go){cursor:pointer}
.ct:active, .ev:active{transform:scale(.99)}
.ct.is-new{border-color:color-mix(in srgb,var(--new) 45%,var(--line))}
.glyph{width:46px;height:46px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto}
.glyph svg{width:21px;height:21px;display:block}
.g-vid{background:var(--vid-soft);color:var(--vid)}
.g-pic{background:var(--pic-soft);color:var(--pic)}
.g-tra{background:var(--tra-soft);color:var(--tra)}
.g-off{background:var(--off-soft);color:var(--off)}
.ct-main{min-width:0;display:grid;gap:5px}
.ct-l1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
/* 1 活動名稱：最大、最重 */
.ct-title{font-family:var(--display);font-size:14.5px;font-weight:600;line-height:1.3;
  color:var(--fg);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
/* 2 類型：實心色票，跟左側圖示同色系，掃讀時最先被看到的分類 */
.ct-kinds{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kind{font-family:var(--data);font-size:11.5px;font-weight:600;padding:3.5px 9px;
  border-radius:7px;white-space:nowrap;border:1px solid}
.k-vid{background:var(--vid-soft);color:var(--vid);
  border-color:color-mix(in srgb,var(--vid) 38%,transparent)}
.k-pic{background:var(--pic-soft);color:var(--pic);
  border-color:color-mix(in srgb,var(--pic) 38%,transparent)}
.k-tra{background:var(--tra-soft);color:var(--tra);
  border-color:color-mix(in srgb,var(--tra) 38%,transparent)}
.k-off{background:var(--off-soft);color:var(--off);
  border-color:color-mix(in srgb,var(--off) 38%,transparent)}
/* 3 拍到誰 ＋ 拍攝者 ＋ 平台 */
.ct-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;
  color:var(--muted);line-height:1.45}
.ct-meta>*+*::before{content:"·";margin-right:6px;color:var(--line)}
.ct-subj{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap;
  color:var(--fg-2);font-weight:500}
.subj1{display:inline-flex;align-items:center;gap:4px}
.mini{width:18px;height:18px;border-radius:50%;flex:0 0 auto;object-fit:cover;display:block;
  box-shadow:0 0 0 1px var(--line-2)}
.mini-ini{display:grid;place-items:center;font-family:var(--display);font-size:9.5px;
  font-weight:700;color:#fff;line-height:1}
.ct-who{font-family:var(--data);font-size:12px;color:var(--muted)}
/* 4 時間：最小、最淡 */
.ct-l3{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:2px}
.ct-time{font-family:var(--data);font-size:10.5px;color:var(--muted);opacity:.78;
  font-variant-numeric:tabular-nums}
.ct-l3 .go{margin-left:auto}
.ct-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px}
.scroller{display:flex;gap:8px;overflow-x:auto;flex:1 1 0;min-width:0;
  padding-block:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:0 0 auto}
.frow-sel{gap:8px}
.frow-sel .fsel{flex:1 1 38%;min-width:0}

/* ── 標籤 ── */
.bd{font-size:11px;font-weight:500;padding:3.5px 8px;border-radius:6px;white-space:nowrap;
  font-family:var(--data)}
.bd-cap{background:var(--pic-soft);color:var(--pic)}
.bd-tra{background:var(--tra-soft);color:var(--tra)}
.bd-auto{background:var(--sunk);color:var(--muted)}
.bd-site{background:var(--off-soft);color:var(--off)}
.bd-new{background:var(--new-soft);color:var(--new)}
.bd-cp{background:var(--cp-soft);color:var(--cp);font-weight:700}
.bd-k{background:var(--sunk);color:var(--muted)}
.ext{font-family:var(--data);font-size:10.5px;color:var(--muted);
  border:1px solid var(--line);padding:2px 6px;border-radius:5px}

/* ── 按鈕：點選有放大縮小感 ── */
.go{font-family:var(--data);font-size:12.5px;font-weight:500;color:#fff;
  background:var(--accent);text-decoration:none;border-radius:8px;padding:7px 13px;
  white-space:nowrap;display:inline-flex;align-items:center;gap:5px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);
  transition:transform .11s cubic-bezier(.34,1.56,.64,1), background .13s ease}
.go:hover{background:var(--accent-2)}
.go:active{transform:scale(.93)}
.go-ghost{color:var(--accent);background:transparent;
  border:1px solid color-mix(in srgb,var(--accent) 38%,transparent);box-shadow:none}
.go-ghost:hover{background:var(--accent-soft)}

/* ── 篩選 ── */
.filters{background:var(--sunk);border:1px solid var(--line-2);border-radius:var(--r);
  padding:12px 13px;margin-bottom:13px;display:grid;gap:10px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.frow[hidden]{display:none}
.fsel[hidden]{display:none}
.flab{font-family:var(--data);font-size:10px;color:var(--muted);letter-spacing:.09em;
  text-transform:uppercase;min-width:66px;flex:0 0 auto}
.chip{font-size:12.5px;background:var(--card);color:var(--fg-2);border:1px solid var(--line);
  padding:5px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
  min-height:44px;display:inline-flex;align-items:center;
  transition:transform .11s cubic-bezier(.34,1.56,.64,1), background .13s ease, color .13s ease}
.chip:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));color:var(--accent)}
.chip:active{transform:scale(.92)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent);
  font-weight:500}
.fsel{font-size:12.5px;font-family:var(--body);background:var(--card);color:var(--fg);
  border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%;cursor:pointer;
  min-height:44px;
  transition:border-color .13s ease}
.fsel:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.clearf{font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;
  text-decoration:underline;padding:5px 4px;border-radius:6px;flex:0 0 auto;
  min-height:44px;display:inline-flex;align-items:center;
  transition:transform .11s ease, color .13s ease}
.clearf:hover{color:var(--accent)}
.clearf:active{transform:scale(.93)}

.empty{background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r);
  padding:26px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
.empty svg{width:26px;height:26px;opacity:.45;margin-bottom:8px;display:block;
  margin-inline:auto}

/* ── debug ── */
#dbg{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;
  margin-top:22px;box-shadow:var(--sh)}
#dbg h2{font-size:14px;padding:14px 16px;border-bottom:1px solid var(--line-2)}
.tscroll{overflow-x:auto;max-height:280px}
table{width:100%;border-collapse:collapse;font-family:var(--data);font-size:11.5px}
th{text-align:left;padding:8px 11px;color:var(--muted);font-weight:500;background:var(--sunk);
  position:sticky;top:0;white-space:nowrap}
td{padding:7px 11px;border-top:1px solid var(--line-2);vertical-align:top}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .go:active,.chip:active,.clearf:active{transform:none!important}
}
@media (max-width:540px){
  .flab{min-width:52px;font-size:9.5px}
  .panel-bd{padding:12px}
  .glyph{width:40px;height:40px;border-radius:10px}
  .glyph svg{width:18px;height:18px}
  .ct{gap:10px;padding:12px}
}
</style>
</head>
<body>
<div class="top">
  <div class="top-in">
    <span class="brand"><span class="dot"></span>NamtanFilm 行程與內容</span>
  </div>
  <div class="tabs-wrap"><div class="tabs" role="tablist">
    <button class="tab" id="tab-sched" type="button" role="tab" aria-selected="false">
      接下來的行程<span class="tab-n" id="tab-n-ev"></span><span class="tab-dot" id="tab-dot-ev" hidden></span></button>
    <button class="tab" id="tab-content" type="button" role="tab" aria-selected="false">
      活動後內容<span class="tab-n" id="tab-n-ct"></span><span class="tab-dot" id="tab-dot" hidden></span></button>
  </div></div>
</div>

<div class="wrap">
  <div class="warn" id="nouser" hidden>
    這個連結少了編號，你看到的內容是完整的，但我們收不到使用紀錄。
    請用我們私訊給你的那一條連結開啟，謝謝！
  </div>

  <section class="panel" id="sec-sched">
    <div class="panel-bd">
      <div class="newrow"><span class="newpill mono" id="newpill-ev" hidden></span></div>
      <div class="evs" id="evs"></div></div>
    <span hidden id="n-ev"></span>
  </section>

  <section class="panel" id="sec-content">
    <div class="panel-bd">
      <div class="newrow"><span class="newpill mono" id="newpill" hidden></span></div>
      <span hidden id="n-ct"></span>

const INI_C={Milk:"#6f8fd6",Love:"#cf6d8d",View:"#4f9b82",Mim:"#c08a46"};
function miniChip(n) {
  const f = FACE[n];
  const av = f
    ? `<img class="mini" src="${f}" alt="" width="18" height="18" decoding="async">`
    : `<span class="mini mini-ini" style="background:${INI_C[n] || "#8a8f98"}" aria-hidden="true">${esc(n.slice(0,1))}</span>`;
  return `<span class="subj1">${av}${esc(n)}</span>`;
}
function castChip(n, mascot) {
  const f = FACE[n];
  const av = f
    ? `<img class="face" src="${f}" alt="" width="30" height="30" decoding="async">`
    : `<span class="ini" style="background:${INI_C[n] || "#8a8f98"}" aria-hidden="true">${esc(n.slice(0,1))}</span>`;
  return `<span class="cm${mascot ? " is-mascot" : ""}">${av}<span class="cm-n">${esc(n)}</span></span>`;
}
function renderEvents() {
  /* 開始時間（沒寫時間的當天 23:59），全部用台灣時間比 */
  const startOf = e => e.date + "T" + (e.time || "23:59");
  const ms = t => Date.parse(t + ":00+08:00");
  const nowMs = ms(twNow());
  /* 活動開始後 3 小時內仍算「進行中」，不要一開播就被歸到已完成 */
  const LIVE_MS = 3 * 60 * 60 * 1000;

  const upcoming = [], done = [];
  EVENTS.forEach(e => (ms(startOf(e)) + LIVE_MS >= nowMs ? upcoming : done).push(e));
  upcoming.sort((a, b) => startOf(a).localeCompare(startOf(b)));   /* 近的在前 */
  done.sort((a, b) => startOf(b).localeCompare(startOf(a)));       /* 剛結束的在前 */

  /* 分頁上的數字維持「還沒發生的場次」，那才是行動訊號 */
  document.getElementById("n-ev").textContent = upcoming.length + " 場";
  document.getElementById("tab-n-ev").textContent = upcoming.length;

  const card = (e, isDone) => {
    /* 已開始、但還在 3 小時的緩衝內 —— 標成進行中，位置仍留在「接下來」 */
    const live = !isDone && ms(startOf(e)) <= nowMs;
    return `<div class="ev${isDone ? " done" : ""}">
    <div class="ev-top">
      <span class="ev-date">${md(e.date)}${e.time ? "　" + e.time : "　時間未定"}</span>
      <span class="bd bd-k">${esc(e.type)}</span>${
      live ? '<span class="bd bd-live">進行中</span>' : ""}
    </div>
    <div class="cast">${
      e.artists.map(a => castChip(a, false)).join("")
    }${
      (e.tags || []).map(t => castChip(t, true)).join("")
    }</div>
    <div class="ev-t">${esc(e.title)}</div>
    <div class="ev-meta">
      <span>${e.online ? "線上" : "線下"}・${esc(e.venue)}</span>
    </div>
    ${e.ht && e.ht.length ? `<div class="ev-ht"><span class="ht-lab">刷推</span>${
      e.ht.map(h => `<span class="ht">${esc(h)}</span>`).join("")}</div>` : ""}
    <div class="ct-foot">
      ${e.src
        ? `<a class="go go-ghost" href="${esc(e.src)}" target="_blank" rel="noopener" data-ev="${e.id}">看官方公告 ↗</a>`
        : '<span class="ext">無官方公告</span>'}
    </div></div>`;
  };

  const box = document.getElementById("evs");
  let html = "";
  if (upcoming.length) {
    html += upcoming.map(e => card(e, false)).join("");
  } else {
    html += '<div class="empty">' + ICON.none
         + '目前沒有已公告的活動。<br>有新公告我們會馬上更新，可以過幾天再回來看。</div>';
  }
  if (done.length) {
    html += `<div class="ev-sep"><span class="lab">已完成</span>`
          + `<span class="n">${done.length} 場</span></div>`
          + done.map(e => card(e, true)).join("");
  }
  box.innerHTML = html;

  box.querySelectorAll("[data-ev]").forEach(a =>
    a.addEventListener("click", () => track("外連點擊", "行程區", a.dataset.ev)));
}

  /* 點擊用事件代理，因為 chip 會被重畫 */
  CHIP_ROWS.forEach(r => {
    document.getElementById(r.host).addEventListener("click", e => {
      const b = e.target.closest(".chip");
      if (!b) return;
      F[r.key] = (F[r.key] === b.dataset.v) ? null : b.dataset.v;
      track("篩選", r.label, F[r.key] || "清除");
      applyFilters();
    });
  });

  const sel = document.getElementById("f-ev");
  /* 活動這一排刻意不隨其他條件收斂：它是最上層，而且要保留「已結束但還沒有內容」的場次 */
  EVENTS.filter(e => e.date < TODAY || CONTENTS.some(c => c.ev === e.id))
        .sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")))
        .forEach(e => {
    const n = CONTENTS.filter(c => c.ev === e.id).length;
    sel.insertAdjacentHTML("beforeend",
      `<option value="${e.id}">${md(e.date)} ${esc(e.title)}（${n}）</option>`);
  });
  sel.addEventListener("change", () => {
    F.ev = sel.value;
    track("依活動檢索", "內容區", sel.value || "清除");
    applyFilters();
  });

  const who = document.getElementById("f-who");
  who.addEventListener("change", () => {
    F.who = who.value;
    track("依拍攝者檢索", "內容區", who.value || "清除");
    applyFilters();
  });

  document.getElementById("clearf").addEventListener("click", () => {
    F.subj = F.type = F.tr = null; F.ev = F.who = "";
    sel.value = "";
    track("清除篩選", "內容區", "全部");
    applyFilters();
  });

  paintChips();
  paintWho();
}
function okSubj(c) {
  if (!F.subj) return true;
  /* 「NamtanFilm」不是某一個人，是「這筆有兩人同框、或直播裡聊到／出現對方」 */
  if (F.subj === "NamtanFilm")
    return !!(c.cp || (c.subj.includes("Namtan") && c.subj.includes("Film")));
  return c.subj.includes(F.subj);
}
function okTr(c) {
  if (!F.tr) return true;
  if (F.tr === "文案有翻譯") return !!c.cap;
  if (F.tr === "完整翻譯") return c.ct === "粉絲翻譯";
  if (F.tr === "平台字幕") return c.ct === "平台字幕";
  return true;
}
function match(c) {
  return okSubj(c) && okTr(c)
      && (!F.type || c.ct === F.type)
      && (!F.ev   || c.ev === F.ev)
      && (!F.who  || c.who === F.who);
}
/* 算某一排有哪些選項時，要把那一排自己排除在外。
   不這樣做的話，選了 Namtan 之後其他人就全部消失，等於選了就換不掉。 */
function poolExcept(skip) {
  return CONTENTS.filter(c =>
       (skip === "subj" || okSubj(c))
    && (skip === "tr"   || okTr(c))
    && (skip === "type" || !F.type || c.ct === F.type)
    && (skip === "ev"   || !F.ev   || c.ev === F.ev)
    && (skip === "who"  || !F.who  || c.who === F.who));
}
function availSubj() {
  const pool = poolExcept("subj");
  const has = new Set();
  pool.forEach(c => c.subj.forEach(x => has.add(x)));
  const duo = pool.some(c => c.cp || (c.subj.includes("Namtan") && c.subj.includes("Film")));
  return SUBJ.filter(x => x === "NamtanFilm" ? duo : has.has(x));
}
function availType() {
  const pool = poolExcept("type");
  return allTypes().filter(t => pool.some(c => c.ct === t));
}
function availTr() {
  const pool = poolExcept("tr");
  return TR_OPTS.filter(t => pool.some(c =>
    t === "文案有翻譯" ? c.cap : t === "完整翻譯" ? c.ct === "粉絲翻譯" : c.ct === "平台字幕"));
}
const CHIP_ROWS = [
  { host:"f-subj", key:"subj", label:"人物", avail: availSubj },
  { host:"f-type", key:"type", label:"類型", avail: availType },
  { host:"f-tr",   key:"tr",   label:"翻譯", avail: availTr   }
];
/* 選到一半條件變得沒有內容時自動放掉，不然會卡在一個看不見的條件上。
   放掉一個會影響其他排，所以要反覆算到不再變動為止。 */
function settleFilters() {
  for (let i = 0; i < 4; i++) {
    let changed = false;
    CHIP_ROWS.forEach(r => {
      if (F[r.key] && !r.avail().includes(F[r.key])) { F[r.key] = null; changed = true; }
    });
    if (F.who && !poolExcept("who").some(c => c.who === F.who)) { F.who = ""; changed = true; }
    if (!changed) return;
  }
}
function paintChips() {
  CHIP_ROWS.forEach(r => {
    const el = document.getElementById(r.host);
    const opts = r.avail();
    el.innerHTML = opts.map(v =>
      `<button class="chip" type="button" aria-pressed="${F[r.key] === v}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
    /* 只剩一個選項的那一排等於篩不掉任何東西，收起來 */
    el.closest(".frow").hidden = opts.length < 2;
  });
}
function paintWho() {
  const who = document.getElementById("f-who");
  const cnt = {};
  poolExcept("who").forEach(c => cnt[c.who] = (cnt[c.who] || 0) + 1);
  const keep = F.who;
  who.innerHTML = '<option value="">全部拍攝者</option>'
    + Object.entries(cnt).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
        .map(([h, n]) => `<option value="${esc(h)}">${esc(h)}（${n}）</option>`).join("");
  who.value = keep;
  who.hidden = Object.keys(cnt).length < 2;
}
function applyFilters() {
  settleFilters();
  paintChips();
  paintWho();
  renderContents();
}
function renderContents() {
  const list = CONTENTS.filter(match).sort((a,b) => dt(b).localeCompare(dt(a)));
  document.getElementById("n-ct").textContent =
    list.length === CONTENTS.length ? CONTENTS.length + " 筆"
                                    : list.length + " / " + CONTENTS.length + " 筆";
  document.getElementById("tab-n-ct").textContent = list.length;
  const box = document.getElementById("cts");
  if (!list.length) {
    const ev = F.ev ? EV_BY_ID[F.ev] : null;
    const bare = ev && !CONTENTS.some(c => c.ev === F.ev);
    box.innerHTML = '<div class="empty">' + ICON.none + (bare
      ? `「${esc(ev.title)}」還沒有內容。<br>活動後的飯拍和翻譯通常要幾小時到一兩天才會出現，可以晚點再回來看。`
      : '這組條件沒有內容。<br>試試清除篩選看看。') + '</div>';
    return;
  }
  /* 第一次造訪時每一筆都「比上次造訪新」。全部都掛 NEW 等於沒有 NEW，
     還會讓之後真正的新內容失去提示效果，所以這種情況一律不掛。 */
  const allNew = CONTENTS.length > 0 && CONTENTS.every(isNew);
  box.innerHTML = list.map(c => {
    const e = EV_BY_ID[c.ev], n = !allNew && isNew(c), fam = family(c);
    const b = [];
    if (c.cp) b.push('<span class="bd bd-cp">CP 片段</span>');
    if (c.cap) b.push('<span class="bd bd-cap">文案有翻譯</span>');
    if (c.ct === "粉絲翻譯") b.push('<span class="bd bd-tra">完整翻譯</span>');
    if (c.ct === "平台字幕") b.push('<span class="bd bd-auto">平台字幕</span>');
    if (c.fansite) b.push('<span class="bd bd-site">站姊</span>');
    const off = ["bilibili","Threads","YouTube","Instagram"].includes(c.pf);
    const when = (c.prec === "date_only" ? md(c.date) + " 時間不詳"
                  : md(c.date) + " " + c.time + (c.prec === "approx" ? " 左右" : ""))
                 + (Number.isFinite(c.hrs) ? `　${c.hrs < 0 ? "活動前" : "活動後"} ${Math.abs(c.hrs).toFixed(1)} 小時` : "");
    const trType = c.cap ? "cap" : c.ct === "粉絲翻譯" ? "full"
                   : c.ct === "平台字幕" ? "auto" : "";
    return `<div class="ct${n ? " is-new" : ""}">
      <span class="glyph g-${fam}">${ICON[fam]}</span>
      <div class="ct-main">
        <div class="ct-title">${esc(e ? e.title : c.ev)}</div>
        <div class="ct-kinds">
          <span class="kind k-${fam}">${esc(c.ct)}</span>${
          n ? '<span class="bd bd-new">NEW</span>' : ""}${b.join("")}
        </div>
        <div class="ct-meta">${
          c.subj.length ? `<span class="ct-subj">${c.subj.map(miniChip).join("")}</span>` : ""}<span
          class="ct-who">${esc(c.who)}</span><span>${esc(c.pf)}</span>${
          off ? '<span class="ext">站外</span>' : ""}</div>
        <div class="ct-l3">
          <span class="ct-time">${when}</span>
          <a class="go" href="${esc(c.url)}" target="_blank" rel="noopener"
             data-c="${c.id}" data-tr="${trType}">看內容 ↗</a>
        </div>
      </div></div>`;
  }).join("");
  box.querySelectorAll("[data-c]").forEach(a =>
    a.addEventListener("click", () =>
      track("外連點擊", "內容區", a.dataset.c, a.dataset.tr)));
}

/* ── 新增提示 ── */
function renderNew() {
  /* 內容區 */
  const n = CONTENTS.filter(isNew).length;
  flagNew("newpill", "tab-dot", n, CONTENTS.length, `新增 ${n} 筆`);
  /* 行程區：只看還沒發生的場次 */
  /* 行程區現在同時顯示未來和已完成的場次，所以總數要算全部 */
  const m = EVENTS.filter(isNewEv).length;
  flagNew("newpill-ev", "tab-dot-ev", m, EVENTS.length, `新增 ${m} 場`);
}
/* 第一次造訪時全部都是「新的」，那就不該整頁都亮 —— 所以 n 等於總數時不顯示 */
function flagNew(pillId, dotId, n, total, label) {
  const pill = document.getElementById(pillId);
  const dot = document.getElementById(dotId);
  const show = n > 0 && n < total;
  if (pill) { pill.textContent = label; pill.hidden = !show; }
  if (dot) dot.hidden = !show;
}

/* ── 分頁：v=a 預設開行程、v=b 預設開內容 ── */
let TAB = null;
function showTab(which, log, how) {
  if (TAB === which) return;
  TAB = which;
  const isS = which === "sched";
  document.getElementById("sec-sched").hidden = !isS;
  document.getElementById("sec-content").hidden = isS;
  document.getElementById("tab-sched").setAttribute("aria-selected", String(isS));
  document.getElementById("tab-content").setAttribute("aria-selected", String(!isS));
  if (log) {
    track("切換分頁", isS ? "行程區" : "內容區", which + "｜" + (how || "點按"));
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}
/* 左右滑動切換分頁。
   刻意不加任何「可以滑動」的提示文字 —— 那會直接提醒使用者去切換分頁，
   而「會不會主動切到另一區」正是這次要量的東西。 */
function initSwipe() {
  let x0 = 0, y0 = 0, armed = false;
  /* 手勢起點在橫向捲動區（篩選器那幾排）或下拉選單上時不算滑頁 */
  const inScroller = el => !!(el && el.closest && el.closest(".scroller, select, .fsel"));
  addEventListener("touchstart", e => {
    if (e.touches.length !== 1) { armed = false; return; }
    const t = e.touches[0];
    /* 太靠近左右邊緣的手勢留給系統（iOS 的返回手勢）*/
    armed = t.clientX > 24 && t.clientX < window.innerWidth - 24 && !inScroller(e.target);
    x0 = t.clientX; y0 = t.clientY;
  }, { passive: true });
  addEventListener("touchend", e => {
    if (!armed) return;
    armed = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    if (Math.abs(dx) < 60) return;                    /* 位移不夠，當作點按 */
    if (Math.abs(dx) < Math.abs(dy) * 1.6) return;    /* 不夠水平，是在上下捲動 */
    showTab(dx < 0 ? "content" : "sched", true, "滑動");
  }, { passive: true });
}

/* 整張卡可點：點卡片的任何空白處，等同按那顆「看內容／看官方公告」。
   直接觸發原本的 <a>，所以追蹤、target=_blank、rel 全部沿用，不另外寫一套。 */
function initCardClick(hostId) {
  document.getElementById(hostId).addEventListener("click", e => {
    /* 本來就有自己行為的東西不要攔：連結、刷推標籤、下拉、按鈕 */
    if (e.target.closest("a, .ht, select, button, input")) return;
    const card = e.target.closest(".ct, .ev");
    if (!card) return;
    const a = card.querySelector("a[data-c], a[data-ev]");
    if (!a) return;
    /* 使用者正在反白選字就不要跳走 */
    try { if (String(window.getSelection() || "").length > 2) return; } catch (err) {}
    a.click();
  });
}

function applyV() {
  showTab(V === "b" ? "content" : "sched", false);
  initSwipe();
  initCardClick("cts");
  initCardClick("evs");
  document.getElementById("tab-sched")
    .addEventListener("click", () => showTab("sched", true));
  document.getElementById("tab-content")
    .addEventListener("click", () => showTab("content", true));
}

/* FANTRACE 3.3：僅載入已核准內容；排除已確認的測試貼文。 */
const EXCLUDED_TEST_IDS = new Set(["X-2108049892035965013"]);
function contentKey(c) {
  const u = String(c.url || "").trim();
  const x = u.match(/^https?:\/\/(?:www\.)?(?:x\.com|twitter\.com)\/(?:[^/]+\/)?status\/(\d+)/i);
  if (x) return "x:" + x[1];
  return u ? "url:" + u.replace(/\/$/, "").toLowerCase() : "id:" + String(c.id || "");
}
async function loadApprovedContents() {
  try {
    const response = await fetch("./approved_contents.json", {cache:"no-store"});
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();
    if (!data || !Array.isArray(data.contents)) throw new Error("JSON 格式不正確");
    const seen = new Set(CONTENTS.map(contentKey));
    const knownEvents = new Set(EVENTS.map(e => e.id));
    let added = 0;
    for (const c of data.contents) {
      if (!c || typeof c !== "object" || !c.url || !knownEvents.has(c.ev)) continue;
      if (EXCLUDED_TEST_IDS.has(String(c.id || "")) || /(?:x\.com|twitter\.com)\/(?:i\/)?(?:status\/)?2108049892035965013(?:\D|$)/i.test(c.url)) continue;
      const key = contentKey(c);
      if (seen.has(key)) continue;
      seen.add(key);
      CONTENTS.push(c);
      added++;
    }
    console.info("FANTRACE 3.2：新增已核准貼文", added, "篇");
  } catch (err) {
    console.warn("FANTRACE 3.2：無法載入已核准貼文，沿用原有手動內容", err);
  }
}

/* ── 啟動 ── */
document.getElementById("nouser").hidden = !!U;
document.getElementById("dbg").hidden = !DEBUG;
/* 載入後才建立篩選器，讓新增貼文能出現在活動與拍攝者選單。 */
async function startFantrace() {
  await loadApprovedContents();
  renderEvents();
  initFilters();
  renderContents();
  renderNew();
  applyV();
  track("開啟頁面", V === "b" ? "內容區（預設）" : "行程區（預設）", ARRIVE);
}
startFantrace();

/* 離開頁面時把「上次造訪」更新成現在 */
window.addEventListener("pagehide", () => {
  try { localStorage.setItem("ft_last_" + (U||"x"), twNow()); } catch(e) {}
});
</script>
